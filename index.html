:root{--bg:#f1f4f9;--panel:#fff;--ink:#1c2a4a;--muted:#5d6b85;--line:#dfe6f0;--gold:#e89b0c;--gold-ink:#3a2600;--ok:#1f8a5b;--no:#c0392b;--pink:#d6336c;--soft:#fde8f0;--navy:#1c2a4a;--on-navy:#fff;
--display:"Baloo 2","Mukta",system-ui,sans-serif;--body:"Mukta",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1727;--panel:#1b2740;--ink:#e9eef8;--muted:#9fadc6;--line:#2f3d5c;--gold:#f2b032;--gold-ink:#2b1c00;--ok:#4cc38a;--no:#f0766a;--pink:#f06595;--soft:#3a2238;--navy:#27365a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1727;--panel:#1b2740;--ink:#e9eef8;--muted:#9fadc6;--line:#2f3d5c;--gold:#f2b032;--gold-ink:#2b1c00;--ok:#4cc38a;--no:#f0766a;--pink:#f06595;--soft:#3a2238;--navy:#27365a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;transition:transform .12s,background .2s,color .2s,opacity .2s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:0 16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font:700 26px/1 var(--display);margin:0;color:var(--pink)}
h2{font:700 17px/1.2 var(--display);margin:0 0 6px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who b{font:700 19px var(--display)}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.users .btn{flex-direction:column;min-height:120px;white-space:normal;font-size:16px}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--pink);border-color:var(--pink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys .btn{min-height:52px;font-size:20px}
#view.in>*{animation:up .32s both}
#view.in>*:nth-child(2){animation-delay:.05s}#view.in>*:nth-child(3){animation-delay:.1s}#view.in>*:nth-child(n+4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#d6336c,#f08c2e)}
.hero.d{background:linear-gradient(135deg,#1c2a4a,#3b5bdb)}
.hero small{font-size:14px;opacity:.9}
.big{font:700 44px/1.1 var(--display)}.big em{font:500 16px var(--body);opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.hero .bar{background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--gold);transition:width .5s}
.hero .bar i{background:#fff}
.clocks{display:flex;gap:10px;margin-top:10px}
.clocks div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.clocks b{display:block;font:700 22px/1.1 var(--display)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.grow small,.muted{display:block;color:var(--muted);font-size:13px}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pink)}
.coin{font:700 14px var(--display);color:var(--gold)}
.btn{border:0;border-radius:12px;min-height:40px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--gold);color:var(--gold-ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pk{background:var(--pink);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.no{background:none;border:1px solid var(--no);color:var(--no)}
.btn.sq{padding:8px;width:40px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.pill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;color:var(--muted)}
.pill.ok{color:var(--ok)}.pill.re{color:var(--no)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.places .btn{flex-direction:column;padding:12px 4px;min-height:72px}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7aa7ff,#b197fc)}
.thread{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;animation:up .3s both}
.bub.me{align-self:flex-end;background:var(--pink);border-color:var(--pink);color:#fff}
.bub small{display:block;font-size:11.5px;opacity:.75}
.quick{display:flex;flex-direction:column;gap:6px}
.quick .btn{justify-content:flex-start;white-space:normal;text-align:left}
.form{display:flex;gap:6px;margin-top:8px}
input{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg)}
input.n{flex:none;width:64px}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:8px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--line);min-height:4px;animation:grow .5s both;transform-origin:bottom}
.bars i:last-child{background:var(--pink)}
@keyframes grow{from{transform:scaleY(0)}}
nav{position:fixed;z-index:6;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:12px;position:relative}
nav button[aria-pressed="true"]{color:var(--pink);background:var(--soft)}
nav b{position:absolute;top:0;left:54%;min-width:18px;height:18px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;line-height:18px;padding:0 4px}
.veil{position:fixed;inset:0;z-index:8;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:440px;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));animation:rise .28s cubic-bezier(.2,.9,.3,1.1)}
.shot{height:120px;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--muted);margin:10px 0;width:100%;background:none}
.shot.on{border-style:solid;border-color:var(--ok);color:#fff;background:linear-gradient(135deg,#7aa7ff,#b197fc)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
#toast{position:fixed;z-index:9;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:9;left:50%;top:45%;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #fff;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:14px 0 6px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;display:block;margin:0 auto;padding:8px}
/* Opening splash */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:linear-gradient(160deg,#d6336c,#f08c2e);overflow:hidden;transition:opacity .45s,transform .45s;text-align:center;padding:24px}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-name{font:700 clamp(48px,15vw,72px)/1 var(--display);display:flex;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.sp-name span{display:inline-block;animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d) both}
.sp-name b{display:inline-block;animation:bob 1.4s ease-in-out calc(var(--d) + .7s) infinite}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.3) rotate(-20deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
.sp-line{display:flex;align-items:center;gap:8px;font:600 22px/1.3 var(--body);animation:up .6s .9s both}
.sp-line svg{flex:none;fill:#fff;animation:beat 1s ease-in-out 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}}
.sp-hearts i{position:absolute;bottom:-40px;opacity:.35;animation:floatup 3.2s linear infinite}
.sp-hearts svg{width:var(--s);height:var(--s);fill:#fff;stroke:none}
@keyframes floatup{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.sp-dots{display:flex;gap:8px;margin-top:10px}
.sp-dots i{width:10px;height:10px;border-radius:50%;background:#fff;animation:bob .8s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}.sp-dots i:nth-child(3){animation-delay:.3s}
.veil.still,.veil.still .sheet{animation:none}
/* Larger text pass */
body{font-size:18px}h2{font-size:20px}.seg button,.btn,#toast,.coin,.hero small{font-size:16px}.chips span,.grow small,.muted,.link{font-size:15px}.pill,.note{font-size:14px}.bub small{font-size:13px}nav button{font-size:13.5px}.users .btn{font-size:18px}.btn{min-height:44px}

.post img{width:100%;border-radius:14px;margin:8px 0;display:block}
.quote{font-weight:600;font-size:20px;line-height:1.4;margin:8px 0}
.love{display:flex;align-items:center;gap:4px;color:var(--pink);font-weight:600;margin:6px 0 10px}
.love svg{fill:currentColor}
#cv{width:100%;border:1px solid var(--line);border-radius:14px;touch-action:none;background:#fff;display:block}
.cols{display:flex;gap:10px;margin:10px 0;align-items:center}
.cols button:not(.btn){width:36px;height:36px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.cols button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.prev{width:72px;height:54px;object-fit:cover;border-radius:10px}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 else if(a=="send"){S.st[k][sheet.i]=1;sheet=null;toast(t("sent"))}
 else if(a=="buy"){const c=SHOP[+v][1];if(S.coins[k]>=c){S.coins[k]-=c;S.claims.unshift({k:k,i:+v,tm:now(),g:0});toast(t("got"));burst()}}
 else if(a=="goal")S.goal[k]=+v;
 else if(a=="loc"){S.loc[k]=[+v,now()];toast(t("told")+" "+x(PLACES[+v][0]))}
 else if(a=="ok"||a=="no"){const p=v.split(",").map(Number),c=S.tasks[p[1]][1];if(a=="ok"){S.st[p[0]][p[1]]=2;S.by[p[0]][p[1]]=S.who;S.coins[p[0]]+=c;S.earned[p[0]]+=c;toast(x(KIDS[p[0]])+" +"+c+" "+t("coins"));burst()}else S.st[p[0]][p[1]]=3}
 else if(a=="bonus"){S.coins[+v]+=5;S.earned[+v]+=5;toast(x(KIDS[+v])+" +5 "+t("coins"));burst()}
 else if(a=="given")S.claims[+v].g=1;
 else if(a=="q"){say(S.role=="dad"?S.who:"k",+v);toast(t("sendBtn")+" ✓")}
 else if(a=="say"){const s=$("mi").value.trim();if(!s)return;say(S.who,null,s)}
 else if(a=="addtask"){const s=$("tn").value.trim(),c=Math.max(1,Math.min(50,+$("tc").value||5));if(!s)return;S.tasks.push([[s,s,s],c,"star"]);S.st.forEach(r=>r.push(0));S.by.forEach(r=>r.push(null));toast(t("added"))}
 else if(a=="reset"){S=DEF();shown={};nav=true}
 else return;
 render(nav);
});

 im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const bx=$("bx");if(bx)draft.x=bx.value;draft.img=c.toDataURL("image/jpeg",.75);draft.kind="photo";URL.revokeObjectURL(im.src);render()};im.src=URL.createObjectURL(f)});

 const bye=()=>{s.classList.add("out");setTimeout(()=>s.remove(),450)},tm=setTimeout(bye,3200);s.onclick=()=>{clearTimeout(tm);bye()}})();
